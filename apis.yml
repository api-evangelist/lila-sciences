aid: lila-sciences
name: Lila Sciences
description: 'Lila Sciences is an AI company founded in 2023 that is building what it calls Scientific
  Superintelligence: an autonomous system that runs the scientific method end to end by generating hypotheses,
  designing experiments, executing them in physical AI Science Factories (autonomous robotic laboratory
  networks), and learning from the resulting experimental data. Rather than training on internet text,
  Lila trains a scientific reasoning model on experimental data, coupling it to scalable verifiers and
  instruments such as molecular dynamics simulators, protein structure predictors, quantum chemistry solvers,
  and gene editors, then optimizing the policy with reinforcement learning. The company packages this as
  two commercial offerings: Catalyst, positioned as an operating system for science that accelerates an
  organization''s existing research, and Creation, a partnership model for generating new discoveries,
  launching products, and founding new companies. Lila works across therapeutics (mRNA, proteins, antibodies,
  cell therapies, small molecules), advanced materials, chemicals, energy and environment, oil and gas,
  aerospace and defense, and biotech. It has raised roughly $550M ($200M seed announced March 2025 and
  a $350M Series A closed in October 2025) from investors including General Catalyst and NVIDIA, at a reported
  valuation above $1.3B, and collaborates with NVIDIA on the BioNeMo Agent Toolkit. Lila operates from
  Cambridge MA, San Francisco CA, and London UK. As of this profile Lila publishes no public developer
  API, developer portal, SDKs, or machine-readable API artifacts; this entry is a company identity record
  in the API Evangelist network.'
